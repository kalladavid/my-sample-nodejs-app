<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Input specific overrides for Corporate Modern aesthetic */
        input:focus {
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
            outline: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;

<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center">
<!-- Top Navigation Suppression: Per instructions, login screens suppress the Shell -->
<main class="w-full max-w-md px-container-margin py-stack-lg flex flex-col justify-center min-h-screen">
<!-- Header Section -->
<header class="mb-stack-lg animate-fade-in">
<div class="mb-stack-md">
<span class="text-primary font-bold font-headline-md text-headline-md tracking-tight">NoelServiceHub</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile mb-stack-sm text-text-primary">Welcome back</h1>
<p class="font-body-md text-body-md text-text-secondary">Enter your phone number to continue to your professional dashboard.</p>
</header>
<!-- Form Section -->
<section class="animate-fade-in" style="animation-delay: 0.1s;">
<form class="space-y-stack-md" id="login-form">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1" for="phone">Phone Number</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">call</span>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-text-primary focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all placeholder:text-outline" id="phone" name="phone" placeholder="(555) 000-0000" required="" type="tel">
</div>
</div>
<button class="w-full h-14 bg-primary text-on-primary font-label-md text-label-md rounded-xl shadow-sm hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Continue
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-stack-lg flex items-center py-2">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 font-label-sm text-label-sm text-outline uppercase tracking-widest">or login with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Media Options -->
<div class="grid grid-cols-2 gap-stack-md">
<button class="h-14 flex items-center justify-center border border-outline-variant rounded-xl bg-surface hover:bg-surface-container transition-colors active:scale-95 duration-200">
<div class="w-6 h-6 flex items-center justify-center mr-2">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Google</span>
</button>
<button class="h-14 flex items-center justify-center border border-outline-variant rounded-xl bg-surface hover:bg-surface-container transition-colors active:scale-95 duration-200">
<div class="w-6 h-6 flex items-center justify-center mr-2">
<span class="material-symbols-outlined text-[24px] text-on-surface">apps</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Apple</span>
</button>
</div>
</section>
<!-- Footer / Policy -->
<footer class="mt-stack-lg text-center animate-fade-in" style="animation-delay: 0.2s;">
<p class="font-label-sm text-label-sm text-outline max-w-[280px] mx-auto">
                By continuing, you agree to our 
                <a class="text-primary hover:underline" href="#">Terms of Service</a> and 
                <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
            </p>
<div class="mt-stack-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-semibold hover:underline" href="#">Sign up</a>
</p>
</div>
</footer>
</main>
<!-- Visual Atmosphere: Subtle background texture/blob -->
<div class="fixed top-0 right-0 -z-10 w-full h-full overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -right-[10%] w-[60%] h-[60%] bg-primary-fixed opacity-30 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[10%] -left-[10%] w-[50%] h-[50%] bg-secondary-fixed opacity-20 rounded-full blur-[100px]"></div>
</div>
<!-- Micro-interaction for input formatting -->
<script>
        const phoneInput = document.getElementById('phone');
        
        phoneInput.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });

        const form = document.getElementById('login-form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            
            // Interaction feedback
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Validating...`;
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Sent OTP`;
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-success');
                
                setTimeout(() => {
                    // Simulation of redirection or state change
                    console.log('Login attempt with:', phoneInput.value);
                }, 1000);
            }, 1200);
        });
    </script>
