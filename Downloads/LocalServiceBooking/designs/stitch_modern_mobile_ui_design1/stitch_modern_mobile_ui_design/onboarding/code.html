<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .onboarding-gradient {
            background: radial-gradient(circle at 20% 30%, rgba(37, 99, 235, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(0, 107, 95, 0.05) 0%, transparent 50%);
        }
        .pagination-dot {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pagination-dot.active {
            width: 1.5rem;
            background-color: #2563EB;
        }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: floating 4s ease-in-out infinite;
        }
    </style>
<style>

<body class="bg-background text-on-surface font-body-md overflow-hidden onboarding-gradient h-screen flex flex-col">
<!-- Top AppBar (Suppressed according to Shell Visibility Rule for Onboarding) -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin relative max-w-lg mx-auto w-full">
<!-- Floating Elements for Depth -->
<div class="absolute top-12 left-8 text-primary-container opacity-20 animate-float" style="animation-delay: 1s;">
<span class="material-symbols-outlined text-[64px]">handyman</span>
</div>
<div class="absolute bottom-24 right-8 text-secondary opacity-20 animate-float">
<span class="material-symbols-outlined text-[48px]">cleaning_services</span>
</div>
<!-- Illustration Canvas -->
<div class="w-full aspect-square max-w-[320px] mb-stack-lg relative">
<div class="absolute inset-0 bg-primary-container/10 rounded-full blur-3xl"></div>
<div class="relative z-10 w-full h-full rounded-[2.5rem] overflow-hidden shadow-2xl bg-white border-4 border-white">
<img class="w-full h-full object-cover" data-alt="A high-quality studio portrait of a friendly professional plumber in a clean navy blue uniform, holding a wrench and smiling confidently. The lighting is soft and bright, emphasizing trust and reliability in a corporate modern style. The background is a minimalist, light gray tiled wall with clean white grout lines, following a spacious and professional light-mode aesthetic with primary blue accents." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAb55nJOFvnliUyTzVAeb4JztKEejQ6IbrWbgq5FkCeNCJuNDI7NpCALzmfTnJRxfcaCl8t43_LMB7O-4P4RzXKvp6VwBkr1ELLefLD-mVE8yuQHSKAKed0eYI7oGRgfGnoonrgcjUBwm57UlnY6R3JpVEhpL0pOmCDmIZphKWchxYkqcPZ4N3R0YAghAhdJwKYqTWzmzkWWGsJhJoPTsB2vZf1J13O2oD8CnT27ZMgD7-dYHpOn8cC"/>
</div>
<!-- Trust Badge Overlay -->
<div class="absolute -bottom-4 -right-4 bg-surface shadow-lg rounded-xl p-3 flex items-center gap-2 border border-outline-variant animate-float">
<span class="material-symbols-outlined text-success" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label-md text-label-md text-on-surface">Verified Pro</span>
</div>
</div>
<!-- Content Section -->
<div class="text-center w-full z-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-stack-sm">
                Find Trusted Pros Near You
            </h1>
<p class="font-body-md text-body-md text-text-secondary px-4 leading-relaxed">
                Connect with background-checked local professionals for cleaning, repair, and home maintenance in just a few taps.
            </p>
</div>
<!-- Pagination Dots -->
<div class="flex items-center gap-2 mt-stack-lg mb-stack-lg">
<div class="pagination-dot active h-2 bg-primary rounded-full"></div>
<div class="pagination-dot h-2 w-2 bg-outline-variant rounded-full"></div>
<div class="pagination-dot h-2 w-2 bg-outline-variant rounded-full"></div>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<footer class="p-container-margin pb-12 w-full max-w-lg mx-auto z-20">
<div class="flex flex-col gap-stack-md">
<button class="w-full h-12 bg-primary-container text-on-primary font-label-md text-label-md rounded-xl shadow-md hover:bg-primary transition-all active:scale-95 flex items-center justify-center gap-2 group">
                Get Started
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<button class="w-full h-12 bg-transparent text-primary font-label-md text-label-md rounded-xl hover:bg-surface-container transition-colors">
                Log In
            </button>
</div>
</footer>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const button = document.querySelector('button');
            button.addEventListener('mousedown', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('mouseup', () => {
                button.classList.remove('scale-95');
            });
            
            // Subtle parallax effect on the floating icons
            document.addEventListener('mousemove', (e) => {
                const icons = document.querySelectorAll('.animate-float');
                const x = (window.innerWidth / 2 - e.pageX) / 50;
                const y = (window.innerHeight / 2 - e.pageY) / 50;
                
                icons.forEach(icon => {
                    icon.style.transform = `translate(${x}px, ${y}px)`;
                });
            });
        });
    </script>
