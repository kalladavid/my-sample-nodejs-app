<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .shimmer-bar {
            position: relative;
            overflow: hidden;
        }

        .shimmer-bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(37, 99, 235, 0.2), transparent);
            animation: shimmer 1.5s infinite;
        }

        .logo-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
    </style>

<body class="bg-surface text-on-surface flex flex-col items-center justify-center min-h-screen selection:bg-primary-fixed overflow-hidden">
<!-- Global Layout Container -->
<main class="relative w-full max-w-md h-screen flex flex-col items-center justify-center px-container-margin">
<!-- Background Subtle Pattern -->
<div class="absolute inset-0 z-0 opacity-[0.03] pointer-events-none">
<svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="40" id="grid" patternUnits="userSpaceOnUse" width="40">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="1"></path>
</pattern>
</defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
</div>
<!-- Center Identity Section -->
<div class="z-10 flex flex-col items-center space-y-6 text-center">
<!-- Logo Icon Container -->
<div class="logo-float w-24 h-24 bg-primary-container rounded-3xl flex items-center justify-center shadow-[0_8px_24px_rgba(37,99,235,0.25)] border border-primary/10">
<span class="material-symbols-outlined text-on-primary-container !text-[48px]" style="font-variation-settings: 'FILL' 1;">
                    handshake
                </span>
</div>
<!-- Brand Name & Tagline -->
<div class="space-y-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile tracking-tighter text-primary">NoelServiceHub</h1>
<p class="font-body-md text-text-secondary">
                    Professional services, personally delivered.
                </p>
</div>
</div>
<!-- Progress Indicator -->
<div class="absolute bottom-16 left-1/2 -translate-x-1/2 w-48 space-y-4">
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary w-2/3 rounded-full relative shimmer-bar" style="transition: width 2s cubic-bezier(0.65, 0, 0.35, 1); width: 100%;"></div>
</div>
<p class="font-label-sm text-label-sm text-center text-outline uppercase tracking-widest opacity-60">
                Securing connection...
            </p>
</div>
<!-- Minimal Footer -->
<div class="absolute bottom-8 text-center">
<p class="font-label-sm text-label-sm text-outline flex items-center justify-center gap-1">
<span class="material-symbols-outlined !text-[14px]">verified_user</span>
                Trusted by 50k+ Neighbors
            </p>
</div>
</main>
<!-- Subtle Interaction Scripts -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Micro-interaction: Mouse tracking for subtle background movement
            const main = document.querySelector('main');
            const pattern = document.querySelector('svg');
            
            if (window.matchMedia('(min-width: 768px)').matches) {
                document.addEventListener('mousemove', (e) => {
                    const x = (e.clientX / window.innerWidth - 0.5) * 20;
                    const y = (e.clientY / window.innerHeight - 0.5) * 20;
                    pattern.style.transform = `translate(${x}px, ${y}px)`;
                });
            }

            // Simulate the "Loading" phase transition
            const progressBar = document.querySelector('.bg-primary');
            setTimeout(() => {
                progressBar.style.transition = 'width 2s cubic-bezier(0.65, 0, 0.35, 1)';
                progressBar.style.width = '100%';
            }, 500);
        });
    </script>


</body></html>
