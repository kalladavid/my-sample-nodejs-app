version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - npm install

  pre_build:
    commands:
      - echo Running tests...
      - npm test || echo "No tests found"

  build:
    commands:
      - echo Building the application...
      - echo Build started on `date`
      - grep -Fq "Node.js App" index.html

  post_build:
    commands:
      - echo Build completed on `date`

artifacts:
  files:
    - '**/*'
